services:
  - type: web
    name: express-card-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: EXPRESS_DEMO_MODE
        value: "true"
      - key: EXPRESS_SECRET_KEY
        generateValue: true
